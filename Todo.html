<!DOCTYPE html>
<html>
<head>
<title>To-Do List App</title>

<style>
body{
    font-family:Arial;
    background:#f4f4f4;
    text-align:center;
    padding:20px;
}

.container{
    background:white;
    max-width:500px;
    margin:auto;
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

input{
    width:70%;
    padding:10px;
}

button{
    padding:10px;
    cursor:pointer;
}

li{
    text-align:left;
    margin-top:10px;
    font-size:18px;
}
</style>
</head>

<body>

<div class="container">
<h1>My To-Do List</h1>

<input type="text" id="task" placeholder="Enter a task">
<button onclick="addTask()">Add</button>

<ul id="taskList"></ul>
</div>

<script>

function addTask(){

let task = document.getElementById("task").value;

if(task==""){
alert("Please enter a task");
return;
}

let li = document.createElement("li");
li.innerHTML = task;

li.onclick = function(){
this.style.textDecoration="line-through";
}

document.getElementById("taskList").appendChild(li);

document.getElementById("task").value="";
}

</script>

</body>
</html>
